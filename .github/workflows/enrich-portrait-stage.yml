name: Enrich portrait stage

on:
  push:
    paths:
      - '.github/workflows/enrich-portrait-stage.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrich portrait UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".floating-tag.one{left:-5px;top:25%}.floating-tag.two{right:-12px;bottom:21%}.floating-tag b{color:var(--accent)}"
          new_css = ".floating-tag.one{left:-5px;top:25%}.floating-tag.two{right:-12px;bottom:21%}.floating-tag b{color:var(--accent)}.portrait-stage:before{content:\"\";position:absolute;width:510px;height:510px;border-radius:50%;background:radial-gradient(circle,rgba(255,99,56,.08),transparent 61%);filter:blur(8px);pointer-events:none}.stage-axis{position:absolute;background:rgba(255,255,255,.07);pointer-events:none}.stage-axis.v{width:1px;height:520px;left:50%;top:50%;transform:translate(-50%,-50%)}.stage-axis.h{height:1px;width:520px;left:50%;top:50%;transform:translate(-50%,-50%)}.stage-index,.stage-location,.stage-caption{position:absolute;z-index:5;font:700 9px/1.2 \"DM Sans\",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#77736e}.stage-index{right:7px;top:11%}.stage-location{left:6px;bottom:10%;display:flex;align-items:center;gap:7px}.stage-location i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(255,99,56,.65)}.stage-caption{right:2px;bottom:8%;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.2em}.stage-stack{position:absolute;right:3px;top:24%;z-index:5;display:grid;gap:5px}.stage-stack span{display:block;padding:5px 7px;border:1px solid rgba(255,255,255,.08);background:rgba(8,8,8,.58);backdrop-filter:blur(8px);font:700 8px/1 \"DM Sans\",system-ui,sans-serif;letter-spacing:.13em;color:#8f8b85}.orbit.three{width:min(495px,100vw);animation-duration:39s;border-style:dashed;border-color:rgba(255,255,255,.08)}.orbit.three:before{width:5px;height:5px;top:45%;left:-3px;background:#fff;box-shadow:none}.orbit.three:after{width:8px;height:8px;bottom:16%;right:11%;background:var(--accent)}.orbit-label{position:absolute;z-index:4;padding:5px 8px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(8,8,8,.67);backdrop-filter:blur(8px);font:700 8px/1 \"DM Sans\",system-ui,sans-serif;letter-spacing:.12em;color:#8f8b85;animation:drift 6s ease-in-out infinite}.orbit-label.sql{right:13%;top:8%}.orbit-label.gis{left:6%;bottom:26%;animation-delay:-1.5s}.orbit-label.net{right:3%;bottom:34%;animation-delay:-3s}.orbit-label.bi{left:12%;top:14%;animation-delay:-4.5s}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.portrait-corner{position:absolute;width:18px;height:18px;z-index:4;opacity:.62}.portrait-corner.tl{left:15px;top:92px;border-left:1px solid var(--accent);border-top:1px solid var(--accent)}.portrait-corner.tr{right:15px;top:92px;border-right:1px solid rgba(255,255,255,.6);border-top:1px solid rgba(255,255,255,.6)}.portrait-corner.bl{left:15px;bottom:18px;border-left:1px solid rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.6)}.portrait-corner.br{right:15px;bottom:18px;border-right:1px solid var(--accent);border-bottom:1px solid var(--accent)}.floating-tag.one:after,.floating-tag.two:before{content:\"\";position:absolute;height:1px;background:linear-gradient(90deg,rgba(255,99,56,.55),transparent)}.floating-tag.one:after{width:50px;right:-50px;top:50%}.floating-tag.two:before{width:44px;left:-44px;top:50%;transform:rotate(180deg)}"
          if old_css not in s:
              raise SystemExit('Expected portrait CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = ".portrait-card{width:280px}.portrait-stage{min-height:500px}.floating-tag{font-size:10px}"
          new_mobile = ".portrait-card{width:280px}.portrait-stage{min-height:520px}.floating-tag{font-size:10px}.stage-stack,.stage-caption{display:none}.stage-axis.h{width:360px}.stage-axis.v{height:450px}.orbit.three{width:360px}.orbit-label{font-size:7px}.orbit-label.net{right:0}.orbit-label.gis{left:0}"
          if old_mobile in s:
              s = s.replace(old_mobile, new_mobile, 1)

          old_markup = '<div class="portrait-stage reveal"><div class="orbit"></div><div class="orbit two"></div><div class="portrait-card"><img alt="Mogga Poul Erusto" src="assets/images/mogga-clean-portrait-hq.webp"></div><div class="floating-tag one"><b>7+</b> years across data & ICT</div><div class="floating-tag two">Humanitarian × Enterprise × <b>AI</b></div></div>'
          new_markup = '<div class="portrait-stage reveal"><div class="stage-axis v"></div><div class="stage-axis h"></div><div class="stage-index">07 / SYSTEMS</div><div class="stage-location"><i></i>JUBA / SSD</div><div class="stage-caption">FIELD ↔ PLATFORM</div><div class="stage-stack"><span>IM</span><span>DATA</span><span>SYSTEMS</span></div><div class="orbit three"></div><div class="orbit"></div><div class="orbit two"></div><div class="orbit-label sql">SQL</div><div class="orbit-label gis">GIS</div><div class="orbit-label net">.NET</div><div class="orbit-label bi">POWER BI</div><div class="portrait-card"><img alt="Mogga Poul Erusto" src="assets/images/mogga-clean-portrait-hq.webp"><span class="portrait-corner tl"></span><span class="portrait-corner tr"></span><span class="portrait-corner bl"></span><span class="portrait-corner br"></span></div><div class="floating-tag one"><b>7+</b> years across data & ICT</div><div class="floating-tag two">Humanitarian × Enterprise × <b>AI</b></div></div>'
          if old_markup not in s:
              raise SystemExit('Expected portrait markup not found')
          s = s.replace(old_markup, new_markup, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit portrait update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make portrait composition richer and more layered'
          git push
