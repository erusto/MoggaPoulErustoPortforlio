name: Expand portfolio sections

on:
  push:
    paths:
      - '.github/workflows/expand-portfolio-sections.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand portfolio sections
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          css = r'''
    /* Expanded portfolio sections */
    .section-head{position:relative}.section-head:after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:1px;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.08) 18%,transparent)}
    .work-deck{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.project-feature{min-height:520px}.project-serial{font:700 10px/1 "DM Sans";letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.system-map{position:absolute;right:22px;top:70px;width:220px;height:170px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:radial-gradient(circle at 50% 50%,rgba(255,99,56,.08),transparent 58%)}.system-map:before,.system-map:after{content:"";position:absolute;background:rgba(255,255,255,.08)}.system-map:before{width:1px;top:18px;bottom:18px;left:50%}.system-map:after{height:1px;left:18px;right:18px;top:50%}.map-node{position:absolute;padding:6px 8px;border:1px solid rgba(255,255,255,.11);background:#111;border-radius:999px;font:700 8px/1 "DM Sans";letter-spacing:.1em;color:#aaa6a0}.map-node.n1{left:14px;top:18px}.map-node.n2{right:14px;top:46px}.map-node.n3{left:26px;bottom:24px}.map-node.n4{right:18px;bottom:18px;color:var(--accent)}.project-mini{position:relative;min-height:250px}.project-mini .big-no{position:absolute;right:18px;top:4px;font:800 86px/1 "Manrope";letter-spacing:-.08em;color:rgba(255,255,255,.035)}.signal-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.signal{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8f8b85;text-align:center}.signal b{color:var(--accent)}
    .experience-layout{display:grid;grid-template-columns:220px 1fr;gap:48px}.exp-summary{position:sticky;top:120px;align-self:start}.exp-summary .seven{font:800 clamp(80px,10vw,150px)/.8 "Manrope";letter-spacing:-.08em;color:var(--accent)}.exp-summary p{color:#8f8b85;line-height:1.6}.timeline{position:relative;padding-left:34px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:linear-gradient(var(--accent),rgba(255,255,255,.08) 45%,rgba(255,255,255,.02))}.exp{position:relative;grid-template-columns:130px 1fr auto;padding:28px 0}.exp:before{content:"";position:absolute;left:-34px;top:37px;width:11px;height:11px;border-radius:50%;background:#111;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 0 5px #080808}.exp:first-child:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 20px rgba(255,99,56,.35)}.exp-role{display:inline-block;margin-top:10px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#7f7b75}
    .cap-grid{grid-template-columns:repeat(12,1fr);gap:0}.cap{position:relative;overflow:hidden}.cap:nth-child(1){grid-column:span 6;min-height:330px}.cap:nth-child(2){grid-column:span 6;min-height:330px}.cap:nth-child(3),.cap:nth-child(4){grid-column:span 6;min-height:280px}.cap:before{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.06);border-radius:50%;right:-70px;top:-70px}.cap:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);right:26px;top:26px;box-shadow:0 0 18px rgba(255,99,56,.55)}.cap-tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.cap-tools span{padding:6px 8px;border:1px solid rgba(255,255,255,.08);border-radius:999px;font-size:9px;letter-spacing:.08em;color:#8f8b85}.cap h3{margin-top:62px}.cap:nth-child(1) h3,.cap:nth-child(2) h3{font-size:30px}
    .education{position:relative;overflow:hidden}.education:before{content:"ISBAT";position:absolute;right:-1vw;top:7px;font:800 clamp(110px,22vw,310px)/1 "Manrope";letter-spacing:-.09em;color:rgba(255,255,255,.025);pointer-events:none}.edu-wrap{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:stretch}.edu{max-width:none;position:relative;overflow:hidden}.edu-side{border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(255,99,56,.06),rgba(255,255,255,.015))}.edu-side strong{font:800 72px/.9 "Manrope";letter-spacing:-.07em;color:var(--accent)}.edu-side span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8f8b85}.edu-points{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.edu-points span{padding:7px 9px;border:1px solid var(--line);border-radius:999px;font-size:9px;color:#8f8b85}
    .cta{position:relative;overflow:hidden}.cta:before{content:"CONNECT";position:absolute;left:50%;top:20px;transform:translateX(-50%);font:800 clamp(100px,20vw,280px)/1 "Manrope";letter-spacing:-.09em;color:rgba(255,255,255,.025);white-space:nowrap}.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:920px;margin:34px auto 0}.contact-card{position:relative;padding:22px;border:1px solid var(--line);border-radius:18px;text-decoration:none;text-align:left;background:rgba(255,255,255,.018);transition:.25s}.contact-card:hover{transform:translateY(-5px);border-color:rgba(255,99,56,.4)}.contact-card small{display:block;color:#77736e;text-transform:uppercase;letter-spacing:.14em;font-size:9px;margin-bottom:22px}.contact-card strong{font:700 22px/1.1 "Manrope"}.contact-card span{position:absolute;right:18px;top:18px;color:var(--accent)}.contact-status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;color:#8f8b85;font-size:11px}.contact-status i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(255,99,56,.55)}
    @media(max-width:980px){.work-deck,.experience-layout,.edu-wrap{grid-template-columns:1fr}.exp-summary{position:relative;top:auto}.contact-grid{grid-template-columns:1fr}.cap:nth-child(n){grid-column:span 12}.system-map{opacity:.55}.signal-row{grid-template-columns:repeat(2,1fr)}}
          '''
          s = s.replace('    .experience{border-top:1px solid var(--line)}', css + '\n    .experience{border-top:1px solid var(--line)}')

          work = '''<section class="content" id="work"><div class="shell"><div class="section-head"><div><div class="section-num">01 · Work</div><h2 class="section-title reveal">Selected work</h2></div><p class="section-copy reveal">Systems and data work spanning programme delivery, information management and enterprise technology.</p></div><div class="work-deck"><a class="project project-feature reveal" href="https://www.humanosys.com/" target="_blank"><div class="project-top"><div><span class="project-serial">01 / Flagship</span><div class="project-type" style="margin-top:9px">Enterprise & Humanitarian Technology</div></div><span>↗</span></div><div class="system-map" aria-hidden="true"><span class="map-node n1">RESULTS</span><span class="map-node n2">FORMS</span><span class="map-node n3">ACCESS</span><span class="map-node n4">ANALYTICS</span></div><div class="project-body"><h3>HumanoSys ERMS</h3><p>A modular platform for programmes and projects, linking results chains, activities, tasks, indicators, beneficiaries, forms, analytics and access control.</p><div class="chips"><span class="chip">.NET</span><span class="chip">SQL Server</span><span class="chip">Multi-tenant</span><span class="chip">Analytics</span><span class="chip">M&E</span></div></div></a><div class="work-stack"><a class="project project-mini reveal" href="https://github.com/erusto/Human-Migration-Reporting-System" target="_blank"><span class="big-no">02</span><div class="project-body"><div class="project-type">Reporting Systems</div><h3>Migration Reporting</h3><p>Reporting and data workflows for human mobility information.</p></div></a><a class="project project-mini reveal" href="https://github.com/erusto/Data-Analysis-with-SQL" target="_blank"><span class="big-no">03</span><div class="project-body"><div class="project-type">Data Engineering</div><h3>Data Analysis with SQL</h3><p>SQL work focused on data preparation, querying and analysis.</p></div></a></div></div><div class="signal-row reveal"><div class="signal"><b>01</b> Results</div><div class="signal"><b>02</b> Field Data</div><div class="signal"><b>03</b> Analytics</div><div class="signal"><b>04</b> Access</div><div class="signal"><b>05</b> AI Workflows</div></div></div></section>'''

          exp = '''<section class="content" id="experience"><div class="shell"><div class="section-head"><div><div class="section-num">02 · Experience</div><h2 class="section-title reveal">Experience</h2></div><p class="section-copy reveal">Seven-plus years across information management, data, health systems and ICT.</p></div><div class="experience-layout"><aside class="exp-summary reveal"><div class="seven">7+</div><p>Years across data, ICT and information-management roles, from field-facing operations to enterprise systems.</p></aside><div class="experience timeline"><div class="exp reveal"><div class="exp-date">2023–2026</div><div><h3>Information Management Associate · IOM South Sudan</h3><p>Information management, analytics, reporting and digital workflows supporting humanitarian operations and programme decision-making.</p><span class="exp-role">Information Management</span></div><div class="exp-dot"></div></div><div class="exp reveal"><div class="exp-date">2023</div><div><h3>Data Migration Quality Assurance · PwC Nigeria</h3><p>Data migration quality assurance, validation and reconciliation.</p><span class="exp-role">Data Quality</span></div><div class="exp-dot"></div></div><div class="exp reveal"><div class="exp-date">2021–2022</div><div><h3>Health Information Systems Analyst · IntraHealth International</h3><p>Health information systems, data analysis and visualisation supporting monitoring and decision-making.</p><span class="exp-role">Health Systems</span></div><div class="exp-dot"></div></div><div class="exp reveal"><div class="exp-date">2019–2020</div><div><h3>Database Assistant · IOM DTM</h3><p>Database and information-management support for displacement and mobility-tracking operations.</p><span class="exp-role">Database & IM</span></div><div class="exp-dot"></div></div></div></div></div></section>'''

          caps = '''<section class="content" id="capabilities"><div class="shell"><div class="section-head"><div><div class="section-num">03 · Capabilities</div><h2 class="section-title reveal">Capabilities</h2></div><p class="section-copy reveal">The areas I work in most often, from data and analytics to systems architecture and infrastructure.</p></div><div class="cap-grid"><div class="cap reveal"><span class="cap-index">01</span><h3>Information Management & Analytics</h3><p>Reporting, data quality, dashboards and decision-support workflows.</p><div class="cap-tools"><span>SQL</span><span>Power BI</span><span>SPSS</span><span>Excel</span></div></div><div class="cap reveal"><span class="cap-index">02</span><h3>Enterprise Systems</h3><p>Relational systems, multi-tenant applications, APIs, access control and AI-enabled workflows.</p><div class="cap-tools"><span>.NET</span><span>C#</span><span>SQL Server</span><span>APIs</span></div></div><div class="cap reveal"><span class="cap-index">03</span><h3>GIS & Field Data</h3><p>Geospatial analysis and field-data workflows using GIS and mobile/web collection technologies.</p><div class="cap-tools"><span>ArcGIS</span><span>QGIS</span><span>PostGIS</span><span>Mobile Data</span></div></div><div class="cap reveal"><span class="cap-index">04</span><h3>Infrastructure & Networking</h3><p>Networking, Windows/Linux administration and practical ICT support.</p><div class="cap-tools"><span>CCNP</span><span>Windows</span><span>Linux</span><span>Networking</span></div></div></div></div></section>'''

          edu = '''<section class="education"><div class="shell"><div class="section-num">04 · Education</div><div class="edu-wrap"><div class="edu reveal"><small>ISBAT University</small><h3>MSc Information Technology (Data Engineering)</h3><p>Advanced study in information technology and data engineering, building on a BSc in Applied Information Technology from ISBAT University.</p><div class="edu-points"><span>Data Engineering</span><span>Applied IT</span><span>Systems</span><span>Analytics</span></div></div><aside class="edu-side reveal"><span>Academic foundation</span><strong>ISBAT</strong><span>MSc + BSc</span></aside></div></div></section>'''

          cta = '''<section class="cta" id="contact"><div class="shell"><div class="section-num">05 · Contact</div><h2 class="reveal">Connect with me</h2><p class="reveal">Professional links and public work.</p><div class="contact-grid reveal"><a class="contact-card" href="https://www.linkedin.com/in/mogga-poul-erusto-015694171/" target="_blank"><small>Professional network</small><strong>LinkedIn</strong><span>↗</span></a><a class="contact-card" href="https://github.com/erusto" target="_blank"><small>Public repositories</small><strong>GitHub</strong><span>↗</span></a><a class="contact-card" href="https://www.humanosys.com/" target="_blank"><small>Enterprise products</small><strong>HumanoSys</strong><span>↗</span></a></div><div class="contact-status"><i></i> Juba, South Sudan</div></div></section>'''

          s = re.sub(r'<section class="content" id="work">.*?(?=<section class="content" id="experience">)', work, s, flags=re.S)
          s = re.sub(r'<section class="content" id="experience">.*?(?=<section class="content" id="capabilities">)', exp, s, flags=re.S)
          s = re.sub(r'<section class="content" id="capabilities">.*?(?=<section class="education">)', caps, s, flags=re.S)
          s = re.sub(r'<section class="education">.*?(?=<section class="cta" id="contact">)', edu, s, flags=re.S)
          s = re.sub(r'<section class="cta" id="contact">.*?(?=\n  </main>)', cta, s, flags=re.S)
          p.write_text(s)
      - name: Commit expanded sections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand portfolio creativity across sections" || exit 0
          git push
