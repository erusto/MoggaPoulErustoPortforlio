name: Restore portrait floating tag

on:
  push:
    paths:
      - '.github/workflows/restore-floating-tag.yml'

permissions:
  contents: write

jobs:
  update-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore portrait UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.portrait-copy{position:absolute;left:24px;right:24px;bottom:24px;z-index:3;display:grid;gap:5px;text-shadow:0 2px 14px rgba(0,0,0,.58)}.portrait-copy span{font:700 9px/1.35 "DM Sans",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:rgba(243,239,231,.78)}.portrait-copy span:first-child{color:#fff}.portrait-copy span:last-child{color:var(--accent)}','')
          old = '<div class="portrait-card"><img alt="Mogga Poul Erusto" src="assets/images/mogga-clean-portrait-hq.webp"><div class="portrait-copy"><span>Information Management · Data Engineering</span><span>Enterprise Systems · Humanitarian Technology</span><span>AI-Enabled Workflows</span></div></div><div class="floating-tag one"><b>7+</b> years across data & ICT</div>'
          new = '<div class="portrait-card"><img alt="Mogga Poul Erusto" src="assets/images/mogga-clean-portrait-hq.webp"></div><div class="floating-tag one"><b>7+</b> years across data & ICT</div><div class="floating-tag two">Humanitarian × Enterprise × <b>AI</b></div>'
          if old not in s:
              raise SystemExit('Expected portrait markup not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore portrait floating tag UX'
          git push
