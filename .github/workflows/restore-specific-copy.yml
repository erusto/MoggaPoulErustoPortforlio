name: Restore selected portfolio terminology

on:
  push:
    paths:
      - '.github/workflows/restore-specific-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "I’m Mogga Poul Erusto. I work across information management, data engineering and enterprise systems, with experience in humanitarian operations and digital product development.",
              "I work across information management, data engineering and enterprise systems, with experience in humanitarian operations and digital product development."
          )
          s = s.replace("Programme & Project Systems", "Enterprise & Humanitarian Technology")
          s = s.replace(
              "Monitoring & Evaluation <i></i> .NET",
              "Monitoring & Evaluation <i></i> AI-Enabled Workflows <i></i> .NET"
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore portfolio terminology and tighten hero copy'
          git push
